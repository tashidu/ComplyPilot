name: complypilot

# Isolated from any other Compose project on this host (e.g. codimite-console):
# its own network, volume and container names below, and the db port is not
# published to the host, so nothing here can collide with an unrelated stack.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: complypilot-refundshield:local
    container_name: complypilot-app
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-complypilot}:${POSTGRES_PASSWORD:-complypilot}@db:5432/${POSTGRES_DB:-complypilot}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_BASE_URL: "${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}"
      QWEN_MODEL: "${QWEN_MODEL:-qwen-vl-plus}"
      QWEN_CHAT_MODEL: "${QWEN_CHAT_MODEL:-qwen-plus}"
      # Conversational and explanatory tasks. Left blank, the copilot and the
      # rescue narrative run on Qwen like everything else.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      GUI_AGENT_HEADLESS: "${GUI_AGENT_HEADLESS:-true}"
      WORKFLOW_MODE: "${WORKFLOW_MODE:-local}"
      MULERUN_API_URL: "${MULERUN_API_URL:-}"
      MULERUN_API_KEY: "${MULERUN_API_KEY:-}"
    # Chromium is more reliable with a larger shared-memory allocation.
    shm_size: "1gb"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: complypilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-complypilot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-complypilot}"
      POSTGRES_DB: "${POSTGRES_DB:-complypilot}"
    # Published on 5433, not the Postgres default 5432, so this never fights
    # another project's Postgres container (e.g. codimite-postgres) for the
    # host port. Only needed for `npm run dev` outside Docker; the app
    # container itself reaches this service over the internal network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - complypilot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-complypilot} -d ${POSTGRES_DB:-complypilot}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  complypilot-db-data:
    name: complypilot-db-data
